# fly.toml app configuration file generated for dinner-droid on 2026-06-01T13:29:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dinner-droid'
primary_region = 'lhr'

[build]

[env]
  DATABASE_URL = 'file:/data/dev.db'
  FRONTEND_ORIGIN = 'https://your-frontend.example.com'
  NODE_ENV = 'production'
  PORT = '3001'

[[mounts]]
  source = 'dinner_droid_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
